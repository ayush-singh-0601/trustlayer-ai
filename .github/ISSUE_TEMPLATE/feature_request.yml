name: Feature request
description: Propose an improvement to the local-first TrustLayer experience
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Great features begin with a clear user problem. Early ideas and broad design questions are often better suited to Discussions.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This proposal preserves the local-first, no-account, no-telemetry product direction.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than only a specific implementation.
    validations:
      required: true
  - type: textarea
    id: local-first
    attributes:
      label: Local-first fit
      description: How should this work without a hosted service, required account, or telemetry?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to help implement this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
