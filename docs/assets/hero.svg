<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">TrustLayer AI - local-first AI security</title>
  <description id="description">A TrustLayer AI product banner showing a local AI trust assessment and score.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="0.55" stop-color="#0a1a16"/>
      <stop offset="1" stop-color="#10271f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.24" r="0.7">
      <stop offset="0" stop-color="#32d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#32d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee2b2"/>
      <stop offset="1" stop-color="#1c9d72"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b7dacd" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(72 62)">
      <rect width="56" height="56" rx="15" fill="#35c894"/>
      <path d="M28 10 45 17v13c0 10-7 18-17 22C18 48 11 40 11 30V17l17-7Z" fill="#0a1b16" fill-opacity="0.92"/>
      <path d="M20 21h16v5h-5v14h-6V26h-5Z" fill="#d9fff1"/>
      <text x="72" y="37" fill="#f5fff9" font-size="27" font-weight="750" letter-spacing="0.2">TrustLayer AI</text>
    </g>

    <g transform="translate(72 178)">
      <text fill="#56dba9" font-size="15" font-weight="750" letter-spacing="3.2">LOCAL-FIRST AI SECURITY</text>
      <text y="77" fill="#f7fffb" font-size="62" font-weight="760" letter-spacing="-2.4">Know what your AI</text>
      <text y="145" fill="#f7fffb" font-size="62" font-weight="760" letter-spacing="-2.4">can access.</text>
      <text y="198" fill="#b8cfc6" font-size="23">Inventory, authorize, assess, and score AI systems</text>
      <text y="231" fill="#b8cfc6" font-size="23">entirely on your device.</text>

      <g transform="translate(0 280)" font-size="13" font-weight="700" letter-spacing="1.1">
        <rect width="130" height="36" rx="18" fill="#15382d" stroke="#2d8b69"/>
        <text x="65" y="23" text-anchor="middle" fill="#8aebc5">NO ACCOUNT</text>
        <rect x="142" width="142" height="36" rx="18" fill="#15382d" stroke="#2d8b69"/>
        <text x="213" y="23" text-anchor="middle" fill="#8aebc5">NO TELEMETRY</text>
        <rect x="296" width="136" height="36" rx="18" fill="#15382d" stroke="#2d8b69"/>
        <text x="364" y="23" text-anchor="middle" fill="#8aebc5">APACHE 2.0</text>
      </g>

      <g transform="translate(0 345)">
        <circle cx="6" cy="7" r="6" fill="#35c894"/>
        <text x="24" y="13" fill="#dcebe5" font-size="17">One command. Local SQLite. Optional deep scanner.</text>
      </g>
    </g>

    <g transform="translate(842 84)" filter="url(#shadow)">
      <rect width="366" height="480" rx="24" fill="#f6fbf8"/>
      <rect width="366" height="64" rx="24" fill="#e8f5ef"/>
      <path d="M0 40h366v24H0z" fill="#e8f5ef"/>
      <circle cx="28" cy="31" r="7" fill="#35c894"/>
      <text x="46" y="37" fill="#173b2f" font-size="16" font-weight="720">Local assessment</text>
      <rect x="275" y="20" width="67" height="23" rx="11.5" fill="#d2ece0"/>
      <text x="308.5" y="35.5" text-anchor="middle" fill="#247456" font-size="10" font-weight="800" letter-spacing="1">PRIVATE</text>

      <g transform="translate(183 169)">
        <circle r="74" fill="none" stroke="#dceae4" stroke-width="18"/>
        <circle r="74" fill="none" stroke="url(#score)" stroke-width="18" stroke-linecap="round" stroke-dasharray="428 465" transform="rotate(-90)"/>
        <text y="11" text-anchor="middle" fill="#0f2a21" font-size="48" font-weight="800">92</text>
        <text y="36" text-anchor="middle" fill="#658078" font-size="12" font-weight="700" letter-spacing="1.2">TRUST SCORE</text>
      </g>

      <text x="183" y="275" text-anchor="middle" fill="#174f3c" font-size="13" font-weight="800" letter-spacing="1">APPROVED WITH RESTRICTIONS</text>
      <text x="183" y="299" text-anchor="middle" fill="#71857d" font-size="13">83% evidence coverage</text>

      <g transform="translate(28 330)">
        <rect width="310" height="42" rx="11" fill="#eaf5f0"/>
        <circle cx="21" cy="21" r="6" fill="#31b781"/>
        <text x="38" y="26" fill="#214438" font-size="13" font-weight="650">Data access mapped</text>
        <text x="286" y="26" text-anchor="end" fill="#368366" font-size="12">6 systems</text>

        <rect y="52" width="310" height="42" rx="11" fill="#fff5dc"/>
        <circle cx="21" cy="73" r="6" fill="#e8a72d"/>
        <text x="38" y="78" fill="#5c4619" font-size="13" font-weight="650">Excess permission</text>
        <text x="286" y="78" text-anchor="end" fill="#9c711c" font-size="12">review</text>

        <rect y="104" width="310" height="42" rx="11" fill="#eaf5f0"/>
        <circle cx="21" cy="125" r="6" fill="#31b781"/>
        <text x="38" y="130" fill="#214438" font-size="13" font-weight="650">Target authorization</text>
        <text x="286" y="130" text-anchor="end" fill="#368366" font-size="12">verified</text>
      </g>
    </g>
  </g>
</svg>
